name: Release re package

on:
  workflow_dispatch:
  push:
    tags: ["re-v*"]

permissions:
  contents: read

concurrency:
  group: library-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Require a release commit from master
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/master
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@simbyotic/re' test
      - run: bun run --filter '@simbyotic/re' typecheck
      - run: bun run release:check
      - run: bun run test:release
      - run: bun run release:dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: library-release
          path: dist/library-release/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/re-v') && vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: library-release
          path: dist/library-release/
      - run: node scripts/publish-library.mjs --publish
