name: Release re package

on:
  workflow_dispatch:
  push:
    tags: ["re-v*"]

permissions:
  contents: read

concurrency:
  group: library-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.release-policy.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Require a release commit from master
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/master
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@simbyotic/re' test
      - run: bun run --filter '@simbyotic/re' typecheck
      - run: bun run test:packages
      - run: bun run release:check
      - run: bun run test:release
      - name: Select the supported publishing route
        id: release-policy
        run: node -e 'const fs = require("node:fs"); const { version } = require("./packages/re/package.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `publishable=${/^\d+\.\d+\.\d+$/.test(version)}\n`);'
      - name: Validate stable publication without uploading
        if: steps.release-policy.outputs.publishable == 'true'
        run: bun run release:dry-run
      - name: Retain the local prerelease artifact
        if: steps.release-policy.outputs.publishable != 'true'
        run: echo "Prerelease archive verified. Public prerelease publishing is not implemented."
      - uses: actions/upload-artifact@v4
        with:
          name: library-release
          path: dist/library-release/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/re-v') && vars.NPM_TRUSTED_PUBLISHING == 'true' && needs.verify.outputs.publishable == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: library-release
          path: dist/library-release/
      - run: node scripts/publish-library.mjs --publish
