name: App dependency isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/*/package.json"
      - "packages/re/package.json"
      - "vendor/re-effect3/**"
      - "scripts/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/app-isolation.yml"
  push:
    branches: [master]
    paths:
      - "apps/*/package.json"
      - "packages/re/package.json"
      - "vendor/re-effect3/**"
      - "scripts/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/app-isolation.yml"

jobs:
  resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run check:app-resolution
      - run: bun run test:app-isolation
      - run: bun run test:release
