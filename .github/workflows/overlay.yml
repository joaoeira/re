name: Overlay integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/*/package.json"
      - "apps/overlay/**"
      - "packages/**"
      - "scripts/**"
      - "patches/**"
      - "package.json"
      - "tsconfig*.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/overlay.yml"
  push:
    branches: [master]
    paths:
      - "apps/*/package.json"
      - "apps/overlay/**"
      - "packages/**"
      - "scripts/**"
      - "patches/**"
      - "package.json"
      - "tsconfig*.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/overlay.yml"

jobs:
  resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:app-resolution
      - run: bun run test:app-resolution
      - run: bun run test:release

  overlay:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:app-resolution
      - run: bun run check:overlay
