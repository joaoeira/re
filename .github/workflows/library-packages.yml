name: Library packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - ".changeset/**"
      - ".github/workflows/library-release.yml"
      - "scripts/**"
      - "test/package-consumer/**"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - ".github/workflows/library-packages.yml"
  push:
    branches: [master]
    paths:
      - "packages/**"
      - ".changeset/**"
      - ".github/workflows/library-release.yml"
      - "scripts/**"
      - "test/package-consumer/**"
      - "tsconfig*.json"
      - "package.json"
      - "bun.lock"
      - "apps/*/package.json"
      - ".github/workflows/library-packages.yml"

jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@simbyotic/re' test
      - run: bun run --filter '@simbyotic/re' typecheck
      - run: bun run check:app-resolution
      - run: bun run test:packages
      - run: bun run check:packages
        env:
          RE_CONSUMER_EFFECT_VERSION: "4.0.0-rc.112"

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run test:release
