name: Desktop

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: node -e 'const Database = require("better-sqlite3"); const db = new Database(":memory:"); db.prepare("SELECT 1").get(); db.close();'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - run: node -e 'require("node:assert/strict").equal(require("./test-results/vitest.json").numPendingTests, 0)'
      - run: npm run test:install-local
      - run: npm run package
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: out/make/
          if-no-files-found: error
